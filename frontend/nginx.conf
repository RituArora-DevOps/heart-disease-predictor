server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Set the root directory for the static frontend files
    root /usr/share/nginx/html;
    index index.html;

    # This location block handles all the API calls
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        # IMPORTANT: 'backend' is the service name defined in docker-compose.yml
        # Docker's DNS resolves 'backend' to the correct internal IP.
        proxy_pass http://backend:8000; 

        
        # Forward necessary headers to the FastAPI backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # This block handles all other traffic (the Single Page Application routing)
    # If a file is not found, Nginx serves index.html (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
